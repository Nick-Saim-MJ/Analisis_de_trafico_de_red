
server:
  port: 8080
  
spring:
  kafka:
    bootstrap-servers: ${EC_KAFKA_BOOTSTRAP_SERVERS:localhost:49092}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false


