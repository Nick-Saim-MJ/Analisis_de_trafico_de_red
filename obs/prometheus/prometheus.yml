global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: kafka-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - kafka-exporter:9308

  # Proyecto Sello (S9): métricas de aplicación del consumer de red-telemetria
  # (uso-red/app/consumer_red.py), en el mismo contenedor que el bridge.
  - job_name: uso-red
    metrics_path: /metrics
    static_configs:
      - targets:
          - uso-red:9200
