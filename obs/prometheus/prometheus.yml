global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: kafka-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - kafka-exporter:9308

  # Proyecto Sello (S9): métricas de aplicación del consumer de red-telemetria
  # (uso-red/app/consumer_red.py), en el mismo contenedor que el bridge.
  - job_name: uso-red
    metrics_path: /metrics
    static_configs:
      - targets:
          - uso-red:9200

  # S11: KPI batch y predicción en vivo empujados por el notebook. honor_labels
  # conserva el job/instance de cada push en vez de reemplazarlos por los del scrape.
  - job_name: pushgateway
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets:
          - pushgateway:9091
